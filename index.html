<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#B99BD5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="app.dulcepanelita">
<title>Dulce Panelita · 5.9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header>
  <div class="brand"><div class="logo" data-i="paw"></div><div><b>Dulce Panelita</b><small>Servicios para Mascotas · <span class="ver" id="verLbl">v5.9</span></small></div></div>
  <div class="hs" id="hs"><span class="si" data-i="search"></span><input id="gq" type="search" placeholder="Buscar o escribir un comando…" autocomplete="off" oninput="gSearch(this.value)" onfocus="gSearch(this.value)" aria-label="Buscar"><div id="gres"></div></div>
  <div class="hb">
    <button id="saveBtn" onclick="manualSave()" aria-label="Guardar ahora"><span data-i="save"></span>Guardar</button>
    <button class="hq" onclick="toggleSearch()" data-i="search" aria-label="Buscar"></button>
    <button id="bellBtn" onclick="notifView()" aria-label="Notificaciones"><span data-i="bell" style="display:grid"></span><i id="bellN"></i></button>
    <button id="themeBtn" data-themeico onclick="toggleTheme()" aria-label="Cambiar tema"></button>
    <button onclick="ajustes()" data-i="sliders" aria-label="Configuración"></button>
    <button class="ub" onclick="perfilView()" data-i="user" aria-label="Mi perfil"></button>
  </div>
</header>
<main id="main"></main>
<nav id="nav">
  <div class="side-top"><div class="logo" data-i="paw"></div><div class="bn"><b>Dulce Panelita</b><small>Servicios para Mascotas</small></div></div>
  <div class="tabs">
    <div class="nl">Principal</div>
    <button data-t="dash" onclick="go('dash')"><span data-i="home"></span><em>Inicio</em></button>
    <button data-t="pets" onclick="go('pets')"><span data-i="paw"></span><em>Mascotas</em></button>
    <button data-t="cit" onclick="go('cit')"><span data-i="cal"></span><em>Citas</em></button>
    <button data-t="svc" onclick="go('svc')"><span data-i="receipt"></span><em>Historial</em></button>
    <div class="nl">Gestión</div>
    <button class="only-d" data-t="inv" onclick="go('inv')"><span data-i="box"></span><em>Inventario</em></button>
    <button class="only-d" data-t="prec" onclick="go('prec')"><span data-i="tag"></span><em>Servicios</em></button>
    <button class="only-d" data-t="mapa" onclick="go('mapa')"><span data-i="map-pin"></span><em>Ubicaciones</em></button>
    <button class="only-d" data-t="caja" onclick="go('caja')"><span data-i="wallet"></span><em>Caja</em></button>
    <button class="only-d" data-t="meta" onclick="go('meta')"><span data-i="target"></span><em>Metas</em></button>
    <button id="moreBtn" class="mobile-only" onclick="drawer()"><span data-i="menu"></span><em>Más</em></button>
  </div>
  <button id="fab" onclick="fabSheet()" aria-label="Acciones rápidas"><span data-i="plus"></span></button>
  <div class="side-x">
    <button class="sx" onclick="toggleNav()" title="Contraer menú"><span id="colI" data-i="panel"></span><em>Contraer menú</em></button>
    <button class="sx" onclick="ajustes()" title="Configuración"><span data-i="sliders"></span><em>Configuración</em></button>
    <button class="sx" onclick="ayuda()" title="Ayuda"><span data-i="help"></span><em>Ayuda</em></button>
    <div class="sprof" onclick="perfilView()" role="button" tabindex="0" title="Mi perfil"><div class="sa" id="spA">👤</div><div class="pi"><b id="spN">Mi perfil</b><small id="spP">Completa tus datos</small></div></div>
  </div>
</nav>
<div id="sh"></div><div id="t"></div>
<script src="js/app.js"></script>
<script type="module" src="js/firebase.js"></script>

</body></html>
